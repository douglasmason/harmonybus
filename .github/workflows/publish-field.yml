name: Publish verified Field Play installer
on:
  push:
    branches: [work/publish-field-install]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tested artifact and publish installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_COMMIT: 7c2cffcee8ad98376a33d3c7957e58daa67d3f47
          TESTED_RUN: '39534294507'
          INSTALL_VERSION: 0.2.287
          PREVIOUS_VERSION: 0.2.286-dev.1
          ARTIFACT_NAME: harmonybus-core-candidate
          ARTIFACT_FILE: harmonybus-v0.2.287-module.tar.gz
          ASSET_NAME: harmonybus-v0.2.287-module.tar.gz
        run: python3 scripts/publish_field.py
