name: Publish verified Field Play installer
on:
  push:
    branches: [work/publish-field-install]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tested artifact and publish installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_COMMIT: b6c6f756dd942bf8816647f8483202f96114a1f7
          TESTED_RUN: '39528657744'
          INSTALL_VERSION: 0.2.286-dev.1
          PREVIOUS_VERSION: 0.2.285-dev.1
          ARTIFACT_NAME: harmonybus-core-candidate
          ARTIFACT_FILE: harmonybus-v0.2.286-dev.1-module.tar.gz
          ASSET_NAME: harmonybus-v0.2.286-dev.1-module.tar.gz
        run: python3 scripts/publish_field.py
