name: Publish verified Field Play installer
on:
  push:
    branches: [work/publish-field-install]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tested artifact and publish installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_COMMIT: 8b8292dd5b0c41d7be5711548e7f1a89bc955590
          TESTED_RUN: '39504771384'
          INSTALL_VERSION: 0.2.283-dev.1
          PREVIOUS_VERSION: 0.2.282-dev.2
          ARTIFACT_NAME: harmonybus-core-candidate
          ARTIFACT_FILE: harmonybus-v0.2.283-dev.1-module.tar.gz
          ASSET_NAME: harmonybus-v0.2.283-dev.1-module.tar.gz
        run: python3 scripts/publish_field.py
