name: Publish verified Field Play installer
on:
  push:
    branches: [work/publish-field-install]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tested artifact and publish installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_COMMIT: b1619b9b73f305a7ddbf5f7a8fcd25fe88f60d50
          TESTED_RUN: '39522569287'
          INSTALL_VERSION: 0.2.285-dev.1
          PREVIOUS_VERSION: 0.2.284-dev.1
          ARTIFACT_NAME: harmonybus-core-candidate
          ARTIFACT_FILE: harmonybus-v0.2.285-dev.1-module.tar.gz
          ASSET_NAME: harmonybus-v0.2.285-dev.1-module.tar.gz
        run: python3 scripts/publish_field.py
