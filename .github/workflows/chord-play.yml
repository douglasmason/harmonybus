name: Parent key verification and release
on:
  push:
    branches: [main]
    paths: [src/relative_feedback.h, docs/resolved-operation-feedback.md, src/chord_discovery.h, docs/pad-parent-key.md, tests/**, src/motion.h, src/motion_params.h, tests/performance_controls_test.c, docs/chord-queue.md, src/chord_queue.h, src/chord_register.h, src/motif_runtime.h, tests/chord_queue_test.c, core/include/harmony_core.h, core/src/harmony_core.c, src/scale_context.h, src/clip_timeline_cache.h, modules/harmonybus/module.json, scripts/native_suites.json, docs/chord-play.md, tests/chord_intent_test.c, src/chord_selection.h, src/chord_selection_input.h, src/chord_player.h, modules/harmonybus/dsp/harmonybus.c, tests/chord_selection_test.c, tests/chord_selection_comping_test.c, .github/workflows/chord-play.yml]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chord-play-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  verify-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ARM modules
        run: |
          bash scripts/build_harmonybus_move.sh
          cd dist
          sha256sum harmonybus-v0.2.307-module.tar.gz > SHA256SUMS
      - name: Full native regressions
        run: python3 scripts/run_native_suites.py --jobs 4
      - uses: actions/upload-artifact@v4
        with:
          name: harmonybus-parent-key-307
          path: |
            dist/harmonybus-v0.2.307-module.tar.gz
            dist/SHA256SUMS
      - name: Publish verified main package and advance installer last
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.307 >/dev/null 2>&1; then exit 0; fi
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          python3 -c 'import json; assert json.load(open("release.json"))["version"]=="0.2.306"'
          gh release create v0.2.307 dist/harmonybus-v0.2.307-module.tar.gz dist/SHA256SUMS --target "$GITHUB_SHA" --title 'HarmonyBus 0.2.307 — Parent key before the first chord' --notes-file docs/pad-parent-key.md
          mkdir verified-upload
          gh release download v0.2.307 --dir verified-upload --pattern harmonybus-v0.2.307-module.tar.gz
          (cd verified-upload && sha256sum -c ../dist/SHA256SUMS)
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git switch -C installer-pointer origin/main
          python3 - <<'PY'
          import json
          from pathlib import Path
          path: Path = Path('release.json')
          assert json.loads(path.read_text())['version']=='0.2.306'
          path.write_text(json.dumps({'version':'0.2.307','download_url':'https://github.com/douglasmason/harmonybus/releases/download/v0.2.307/harmonybus-v0.2.307-module.tar.gz'},indent=2)+'\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add release.json
          git commit -m 'Publish verified parent key 0.2.307 [skip ci]'
          git push origin HEAD:main
