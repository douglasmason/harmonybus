name: Shared core candidate (no deployment)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Musical regression suites
        run: python3 scripts/run_native_suites.py --jobs 4
      - name: Differential portable core contract
        run: |
          mkdir -p /tmp/reference
          git show 30397ae7eb876500fcb5d4794252e3e1da7c8064:src/harmony_core.c > /tmp/reference/harmony_core.c
          git show 30397ae7eb876500fcb5d4794252e3e1da7c8064:src/harmony_core.h > /tmp/reference/harmony_core.h
          cc -O2 -shared -fPIC /tmp/reference/harmony_core.c -o /tmp/reference/core.so
          cc -O2 tests/core_parity_test.c core/src/harmony_core.c -ldl -o /tmp/parity
          /tmp/parity /tmp/reference/core.so
      - name: Build ARM candidate
        run: |
          python3 -c 'import json; p="modules/harmonybus/module.json"; d=json.load(open(p)); d["version"] += "-core.1"; open(p,"w").write(json.dumps(d,indent=2)+"\n")'
          bash scripts/build_harmonybus_move.sh
          sha256sum dist/*.tar.gz > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: harmonybus-core-candidate
          path: dist/
