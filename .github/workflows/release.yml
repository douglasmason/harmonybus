name: Build and publish HarmonyBus

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate version/UI
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("modules/harmonybus/module.json"))["version"])')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "HB=dist/harmonybus-v${VERSION}-module.tar.gz" >> "$GITHUB_ENV"
          grep -q "#define HB_VERSION \"${VERSION}\"" modules/harmonybus/dsp/harmonybus.c
          node --check modules/harmonybus/canvas.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          module=json.load(open('modules/harmonybus/module.json'))
          assert module['version']=='0.2.99'
          levels=module['capabilities']['ui_hierarchy']['levels']
          assert levels['root']['name']=='Harmony Bus 0.2.99'
          assert levels['follower_source']['name']=='Foll Map'
          assert levels['follower_root']['name']=='Foll Root'
          assert levels['follower_mod']['name']=='Foll Mod'
          assert levels['follower_mod']['knobs']==[
              'approach','travel_map','mod_scale_above','mod_chrom_below',
              'foll_mod_blank5','approach_reset','approach_scale_next','approach_chrom_next'
          ]
          assert any(p.get('key')=='travel_map' for p in levels['follower_mod']['params'])
          assert levels['next_harm']['name']=='Next Harm'
          assert levels['next_harm']['knobs']==[
              'next_lookahead','next_model','next_shift','next_loop_length',
              'next_position','next_harmony','next_reset'
          ]
          assert levels['global_transpose']['name']=='Global'
          assert levels['global_transpose']['knobs']==[
              'transpose','pretranspose_root','final_root','final_harmony'
          ]
          assert any(item.get('level')=='global_transpose' for item in levels['root']['params'])
          source=Path('modules/harmonybus/dsp/harmonybus.c').read_text()
          assert 'static void hb_render_conductor_event' in source
          assert 'rendered_note=note+g_bus.global_transpose' in source
          assert 'render_pitch=source_note+g_bus.global_transpose' in source
          assert 'int direct=source_note+g_bus.global_transpose' in source
          assert 'if(!strcmp(key,"pretranspose_root"))' in source
          assert 'if(!strcmp(key,"final_root"))' in source
          assert 'if(!strcmp(key,"final_harmony"))' in source
          assert 'hb_render_conductor_event(instance,note,length>=3?input[2]:0,is_on,is_off,input_channel);' in source
          assert 'static void hb_prepare_role_change_flush' in source
          assert 'hb_prepare_role_change_flush(instance);' in source
          assert 'static int hb_emit_role_change_flush' in source
          assert 'role_flush_emitted=hb_emit_role_change_flush' in source
          # Shared harmony/prediction semantics remain global.
          assert 'static double hb_chord_grid_beats(void)' in source
          assert 'static double hb_anticipation_beats(void)' in source
          assert 'hb_global_root_policy()' in source
          assert 'hb_global_explicit_root()' in source
          assert 'static void hb_next_update_playhead(int frames,int sample_rate)' in source
          assert 'static int hb_next_model_accepts_observed' in source
          # Follower voice behavior is now instance-local.
          assert 'int content_map=instance->content_map;' in source
          assert 'int travel=instance->travel_map;' in source
          assert 'int explicit_scale=instance?instance->follower_scale:0;' in source
          assert 'int split=instance->follower_split_map;' in source
          assert 'hb_quant_grid_beats_for(instance)' in source
          assert 'hb_ms_to_beats(instance->boundary_buffer_ms)' in source
          assert 'instance->approach_control=hb_approach_toggle' in source
          assert '"hb16,%d,%d,%d,%d,%d,%d,%d,%d,%d,%d,%d,%d,%d,%d,%d,%d,%d,%d,%d,%d,%d,%d,%d,%d,%d"' in source
          for obsolete in (
              'hb_global_content_map()', 'hb_global_travel_map()', 'hb_global_scale()',
              'hb_set_global_content_map(', 'hb_set_global_travel_map(', 'hb_set_global_scale('
          ):
              assert obsolete not in source, obsolete
          assert '#include "../../../src/follower_timing.h"' in source
          assert '#include "../../../src/closest_split.h"' in source
          assert 'learned_boundary=hb_next_effective_boundary' in source
          assert 'Compare against the UNSHIFTED learned schedule' in source
          closest=source[source.index('static int hb_map_follower_note_closest_split'):source.index('static int hb_map_follower_note_now')]
          assert 'hb_build_closest_split_assignment(' in closest
          queue=source[source.index('static int hb_queue_follower_event'):source.index('static int hb_source_interval_to_default_degree')]
          assert 'hb_follower_capture_target(' in queue
          assert 'hb_next_effective_boundary' in queue
          PY

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y clang lld file

      - name: Run native core, mapping, modifier, and timing tests
        run: |
          clang -std=c11 -O2 tests/harmony_core_test.c src/harmony_core.c -o /tmp/harmony_core_test
          /tmp/harmony_core_test
          clang -std=c11 -O2 tests/approach_state_test.c -o /tmp/approach_state_test
          /tmp/approach_state_test
          clang -std=c11 -O2 tests/approach_pitch_test.c -o /tmp/approach_pitch_test
          /tmp/approach_pitch_test
          clang -std=c11 -O2 tests/closest_split_test.c -o /tmp/closest_split_test
          /tmp/closest_split_test
          clang -std=c11 -O2 tests/follower_timing_test.c -o /tmp/follower_timing_test
          /tmp/follower_timing_test

      - name: Verify loop learning with four conductor callbacks
        run: |
          clang -std=c11 -D_POSIX_C_SOURCE=200809L -O2 tests/loop_learning_test.c src/harmony_core.c -lm -o /tmp/loop_learning_test
          /tmp/loop_learning_test

      - name: Build ARM64 HarmonyBus
        run: bash scripts/build_harmonybus_move.sh

      - name: Verify complete module loading and preset restoration
        run: |
          clang -std=c11 -D_POSIX_C_SOURCE=200809L -O2 -fPIC -shared \
            -include sys/mman.h -include unistd.h -Wl,-z,defs \
            modules/harmonybus/dsp/harmonybus.c src/harmony_core.c \
            -lm -o /tmp/harmonybus-native.so
          clang -std=c11 -O2 tests/module_load_test.c -ldl -o /tmp/harmonybus-load-test
          /tmp/harmonybus-load-test /tmp/harmonybus-native.so
          readelf --dyn-syms --wide build/move/harmonybus-dsp.so | \
            awk '$7 == "UND" && $8 ~ /^hb_/ { print; bad=1 } END { exit bad }'

      - name: Verify HarmonyBus package
        run: |
          gzip -t "$HB"
          rm -rf /tmp/hb-verify && mkdir -p /tmp/hb-verify
          tar -xzf "$HB" -C /tmp/hb-verify
          test -f /tmp/hb-verify/harmonybus/module.json
          test -f /tmp/hb-verify/harmonybus/dsp.so
          test -f /tmp/hb-verify/harmonybus/canvas.js
          node --check /tmp/hb-verify/harmonybus/canvas.js
          python3 - <<'PY'
          import json, os
          module=json.load(open('/tmp/hb-verify/harmonybus/module.json'))
          assert module['version']==os.environ['VERSION']=='0.2.99'
          panel=module['capabilities']['ui_hierarchy']['levels']['follower_mod']
          assert panel['knobs'][1]=='travel_map'
          next_panel=module['capabilities']['ui_hierarchy']['levels']['next_harm']
          assert next_panel['knobs'][0]=='next_lookahead'
          assert next_panel['knobs'][-1]=='next_reset'
          global_panel=module['capabilities']['ui_hierarchy']['levels']['global_transpose']
          assert global_panel['knobs'][0]=='transpose'
          assert global_panel['knobs'][2]=='final_root'
          PY

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$HB" --clobber
          else
            gh release create "$TAG" "$HB" --target "$GITHUB_SHA" --title "Harmony Bus ${TAG}" --notes "Fix frozen Lookahead position and reversed stop detection. Use shared transport beat availability as the authority for Movy private chains, with correct Schwung clock status constants for older hosts. Regression tests now exercise the MIDI FX tick entry point and verify position, upcoming harmony, stop/resume and stale private-chain status."
          fi

      - name: Update Module Store metadata
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          version = os.environ["VERSION"]
          Path("release.json").write_text(json.dumps({"version": version, "download_url": f"https://github.com/douglasmason/harmonybus/releases/download/v{version}/harmonybus-v{version}-module.tar.gz"}, indent=2) + "\n")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release.json
          if ! git diff --cached --quiet; then
            git commit -m "Update release.json for v${VERSION}"
            git push origin main
          fi
