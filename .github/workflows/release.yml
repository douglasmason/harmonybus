name: Build and publish Schwung module
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y clang lld file
      - name: Run native core tests
        run: |
          clang -std=c11 -O2 tests/harmony_core_test.c src/harmony_core.c -o /tmp/harmony_core_test
          /tmp/harmony_core_test
      - name: Build ARM64 module
        run: bash scripts/build_harmonybus_move.sh
      - name: Verify archive and embedded version
        run: |
          ARCHIVE=dist/harmonybus-v0.1.79-module.tar.gz
          gzip -t "$ARCHIVE"
          tar -tzf "$ARCHIVE"
          tar -tzf "$ARCHIVE" | grep -q '^harmonybus/module.json$'
          tar -tzf "$ARCHIVE" | grep -q '^harmonybus/dsp.so$'
          tar -xOzf "$ARCHIVE" harmonybus/module.json > /tmp/module.json
          python3 -c 'import json; assert json.load(open("/tmp/module.json"))["version"] == "0.1.79"'
          tar -xOzf "$ARCHIVE" harmonybus/dsp.so > /tmp/dsp.so
          strings /tmp/dsp.so | grep -q '0.1.79'
      - name: Publish v0.1.79 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.79 >/dev/null 2>&1; then
            gh release upload v0.1.79 dist/harmonybus-v0.1.79-module.tar.gz --clobber
          else
            gh release create v0.1.79 dist/harmonybus-v0.1.79-module.tar.gz --title "Harmony Bus v0.1.79" --notes "Experimental Schwung MIDI FX build for Ableton Move."
          fi
