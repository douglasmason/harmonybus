name: Build and publish HarmonyBus

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply current HarmonyBus normalization
        run: |
          python3 scripts/release_v0288.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/harmonybus/module.json modules/harmonybus/dsp/harmonybus.c
          if ! git diff --cached --quiet; then
            git commit -m 'Normalize HarmonyBus v0.2.88 source'
            git push origin main
          fi

      - name: Resolve and validate version/UI
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("modules/harmonybus/module.json"))["version"])')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "HB=dist/harmonybus-v${VERSION}-module.tar.gz" >> "$GITHUB_ENV"
          grep -q "#define HB_VERSION \"${VERSION}\"" modules/harmonybus/dsp/harmonybus.c
          node --check modules/harmonybus/canvas.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          module=json.load(open('modules/harmonybus/module.json'))
          assert module['version']=='0.2.88'
          levels=module['capabilities']['ui_hierarchy']['levels']
          assert levels['root']['name']=='Harmony Bus 0.2.88'
          assert levels['follower_source']['name']=='Foll Map'
          assert levels['follower_root']['name']=='Foll Root'
          assert levels['follower_mod']['name']=='Foll Mod'
          assert levels['follower_mod']['knobs']==[
              'approach','travel_map','mod_scale_above','mod_chrom_below',
              'foll_mod_blank5','approach_reset','approach_scale_next','approach_chrom_next'
          ]
          assert any(p.get('key')=='travel_map' for p in levels['follower_mod']['params'])
          assert not any(p.get('key')=='foll_mod_blank2' for p in levels['follower_mod']['params'])
          assert levels['next_harm']['name']=='Next Harm'
          assert levels['next_harm']['knobs']==[
              'next_predict','next_lookahead','next_model','next_shift',
              'next_loop_length','next_position','next_harmony','next_reset'
          ]
          assert any(item.get('level')=='next_harm' for item in levels['root']['params'])
          source=Path('modules/harmonybus/dsp/harmonybus.c').read_text()
          assert '#include "../../../src/follower_timing.h"' in source
          assert '#include "../../../src/closest_split.h"' in source
          assert 'static void hb_next_update_playhead' in source
          assert 'static void hb_commit_observed_harmony' in source
          assert 'hb_next_update_playhead();' in source
          assert 'learned_boundary=hb_next_effective_boundary' in source
          assert 'hb_harmony_t committed=hb_observed_read();' in source
          closest=source[source.index('static int hb_map_follower_note_closest_split'):source.index('static int hb_map_follower_note_now')]
          assert 'nominal_by_degree[degree]=source_root_note+source_interval;' in closest
          assert 'hb_build_closest_split_assignment(' in closest
          assert 'hb_build_monotonic_degree_ladder(' not in closest
          queue=source[source.index('static int hb_queue_follower_event'):source.index('static int hb_source_interval_to_default_degree')]
          assert 'hb_follower_capture_target(' in queue
          assert 'hb_next_effective_boundary' in queue
          assert 'instance->follower_queue_age_frames[slot]=0;' in queue
          release=source[source.index('static int hb_release_follower_queue'):source.index('static int hb_reharmonize_held_follower')]
          assert 'hb_follower_needs_same_tick_barrier(' in release
          assert 'if(hb_conductor_pending_for_follow())' not in release
          assert 'if(age<0)' not in release
          PY

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y clang lld file

      - name: Run native core, mapping, modifier, and timing tests
        run: |
          clang -std=c11 -O2 tests/harmony_core_test.c src/harmony_core.c -o /tmp/harmony_core_test
          /tmp/harmony_core_test
          clang -std=c11 -O2 tests/approach_state_test.c -o /tmp/approach_state_test
          /tmp/approach_state_test
          clang -std=c11 -O2 tests/approach_pitch_test.c -o /tmp/approach_pitch_test
          /tmp/approach_pitch_test
          clang -std=c11 -O2 tests/closest_split_test.c -o /tmp/closest_split_test
          /tmp/closest_split_test
          clang -std=c11 -O2 tests/follower_timing_test.c -o /tmp/follower_timing_test
          /tmp/follower_timing_test

      - name: Build ARM64 HarmonyBus
        run: bash scripts/build_harmonybus_move.sh

      - name: Verify HarmonyBus package
        run: |
          gzip -t "$HB"
          rm -rf /tmp/hb-verify && mkdir -p /tmp/hb-verify
          tar -xzf "$HB" -C /tmp/hb-verify
          test -f /tmp/hb-verify/harmonybus/module.json
          test -f /tmp/hb-verify/harmonybus/dsp.so
          test -f /tmp/hb-verify/harmonybus/canvas.js
          node --check /tmp/hb-verify/harmonybus/canvas.js
          python3 - <<'PY'
          import json, os
          module=json.load(open('/tmp/hb-verify/harmonybus/module.json'))
          assert module['version']==os.environ['VERSION']=='0.2.88'
          panel=module['capabilities']['ui_hierarchy']['levels']['follower_mod']
          assert panel['knobs'][1]=='travel_map'
          next_panel=module['capabilities']['ui_hierarchy']['levels']['next_harm']
          assert next_panel['knobs'][0]=='next_predict'
          assert next_panel['knobs'][7]=='next_reset'
          PY

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$HB" --clobber
          else
            gh release create "$TAG" "$HB" --title "Harmony Bus ${TAG}" --notes "HarmonyBus MIDI FX for Ableton Move."
          fi

      - name: Update Module Store metadata
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          version = os.environ["VERSION"]
          Path("release.json").write_text(json.dumps({"version": version, "download_url": f"https://github.com/douglasmason/harmonybus/releases/download/v{version}/harmonybus-v{version}-module.tar.gz"}, indent=2) + "\n")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '4189822+github-actions[bot]@users.noreply.github.com'
          git add release.json
          if ! git diff --cached --quiet; then
            git commit -m "Update release.json for v${VERSION}"
            git push origin main
          fi
