name: Build and publish HarmonyBus

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y clang lld file

      - name: Run native core tests
        run: |
          clang -std=c11 -O2 tests/harmony_core_test.c src/harmony_core.c -o /tmp/harmony_core_test
          /tmp/harmony_core_test

      - name: Build ARM64 HarmonyBus
        run: |
          bash scripts/build_harmonybus_move.sh

      - name: Verify HarmonyBus package
        run: |
          HB=dist/harmonybus-v0.2.29-module.tar.gz
          gzip -t "$HB"
          rm -rf /tmp/hb-verify
          mkdir -p /tmp/hb-verify
          tar -xzf "$HB" -C /tmp/hb-verify
          test -f /tmp/hb-verify/harmonybus/module.json
          test -f /tmp/hb-verify/harmonybus/dsp.so
          python3 -c 'import json; assert json.load(open("/tmp/hb-verify/harmonybus/module.json"))["version"] == "0.2.29"'
          strings /tmp/hb-verify/harmonybus/dsp.so | grep -Fq "0.2.29"
          readelf -Ws /tmp/hb-verify/harmonybus/dsp.so > /tmp/hb-symbols.txt
          grep -q "move_midi_fx_init" /tmp/hb-symbols.txt

      - name: Publish v0.2.29 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.29 >/dev/null 2>&1; then
            gh release upload v0.2.29 dist/harmonybus-v0.2.29-module.tar.gz --clobber
          else
            gh release create v0.2.29 dist/harmonybus-v0.2.29-module.tar.gz \
              --title "Harmony Bus v0.2.29" \
              --notes "HarmonyBus MIDI FX for Ableton Move."
          fi
