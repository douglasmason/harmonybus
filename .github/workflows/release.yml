name: Build and publish HarmonyBus

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: harmonybus-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check CI promotion invariants
        run: |
          python3 scripts/test_ci_release.py
          python3 scripts/test_native_suites.py

      - name: Select checks and recover tested release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_release.py plan hb

      - name: Focused native and UI checks
        if: steps.plan.outputs.mode == 'focused'
        run: |
          node --check modules/harmonybus/canvas.js
          node tests/pad_pulse_widget_test.mjs
          for test in harmony_core input_pad knob_latch connector_harmony pad_feedback external_surface; do
            cc -std=c11 -D_POSIX_C_SOURCE=200809L -O1 -g -fsanitize=undefined -fno-sanitize-recover=all "tests/${test}_test.c" src/harmony_core.c -lm -o "/tmp/${test}_test"
            "/tmp/${test}_test"
          done

      - name: Resolve and validate version/UI
        if: steps.plan.outputs.mode == 'full'
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("modules/harmonybus/module.json"))["version"])')
          # Fail fast on a forgotten guide version before compiling the native suite.
          grep -Fq "HarmonyBus $VERSION" docs/timing-guide.md
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "HB=dist/harmonybus-v${VERSION}-module.tar.gz" >> "$GITHUB_ENV"
          grep -q "#define HB_VERSION \"${VERSION}\"" modules/harmonybus/dsp/harmonybus.c
          node --check modules/harmonybus/canvas.js
          node tests/pad_pulse_widget_test.mjs
          python3 scripts/build_motion_metadata.py
          git diff --exit-code -- src/motion_metadata.h
          python3 scripts/build_scale_catalog.py --check
          python3 scripts/verify_motion_metadata.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          assert Path('modules/harmonybus/module.json').stat().st_size < 65536, 'Schwung reads module metadata into a 64 KiB buffer'
          module=json.load(open('modules/harmonybus/module.json'))
          assert module['version']=='0.2.270'
          assert module['name']=='Harmony Bus'
          assert '0.2.' not in module['description']
          levels=module['capabilities']['ui_hierarchy']['levels']
          canonical={item['key']:item for item in module['capabilities']['chain_params']}
          for key in ('scale_context','conductor_default_scale_context','follower_default_scale_context'):
              assert canonical[key]['options'][:3]==['Current Harm','Current + Next','Full Loop']
          for level in levels.values():
              level['params']=[{**item,**canonical[item['key']]} if 'key' in item else item for item in level['params']]
          buffer=next(p for p in levels['root']['params'] if p.get('key')=='boundary_buffer_ms')
          assert buffer['options']==[f'{ms} ms' for ms in [0,25,50,100,200,350,500,750,1000]]+['1/64','1/32','1/16','1/8','1/4','1/2','1 Bar','2 Bars','4 Bars']
          assert buffer['default']=='1/16'
          assert levels['root']['name']=='Harmony Bus'
          master=next(p for p in levels['global_transpose']['params'] if p.get('key')=='master_transpose')
          assert len(master['options'])==13 and master['default']=='As Played'
          assert levels['global_transpose']['knobs'][0]=='master_transpose'
          travel=next(p for p in module['capabilities']['chain_params'] if p.get('key')=='travel_map')
          assert travel['options'][0]=='None' and 'Direct' not in travel['options']
          assert 'receiver' not in levels
          assert levels['root']['knobs']==['version','track_role','render_channel','receive_channel','quant_timing','chord_timing','anticipation','boundary_buffer_ms']
          assert next(p for p in levels['root']['params'] if p.get('key')=='track_role')['options']==['Conductor','Follower','Receiver','Off']
          assert next(p for p in levels['root']['params'] if p.get('key')=='receive_channel')['options']==['Off']+[str(i) for i in range(1,17)]
          assert levels['chord_player']['name']=='Chords'
          assert levels['pad_display']['name']=='Pads Global'
          assert len(levels['pad_display']['knobs'])==8
          for parameter in levels['pad_display']['params']:
              canonical=next(item for item in module['capabilities']['chain_params'] if item['key']==parameter['key'])
              assert parameter.get('default')==canonical.get('default'), parameter['key']
          assert 'Lookahead' in levels['pad_display']['params'][0]['options']
          assert 'ui_test' not in levels
          assert levels['arp_player']['name']=='Arp / Strum'
          assert next(p for p in levels['arp_player']['params'] if p.get('key')=='arp_hold')['options']==['Momentary', 'Latch - Overlap', 'Latch with Off - Overlap', 'Latch Acc. with Off', 'Latch - Single', 'Latch with Off - Single']
          for page in ('chord_player','arp_player','follower_root','follower_play'):
              assert len(levels[page]['knobs'])<=8
              for key in levels[page]['knobs']:
                  assert any(parameter.get('key')==key for parameter in levels[page]['params'])
          chord_mode=next(parameter for parameter in levels['chord_player']['params'] if parameter.get('key')=='chord_mode')
          assert chord_mode['default']=='Off'
          dominant=next(parameter for parameter in levels['track_scales']['params'] if parameter.get('key')=='track_dominant_scale')
          assert dominant['options']==['None','Harmonic Minor','Melodic Minor','Altered V','Major','Harmonic Major','Simplified Target','Minimal','Follow Role'] and dominant['default']=='Follow Role'
          assert next(p for p in module['capabilities']['chain_params'] if p['key']=='track_dominant_minor_scale')['options']==dominant['options']
          assert next(p for p in module['capabilities']['chain_params'] if p['key']=='conductor_default_dominant_minor_scale')['default']=='Simplified Target'
          assert 'track_dominant_minor_scale' in levels['track_scales']['knobs']
          assert levels['follower_touch']['knobs']==[f'motion_control_{i}' for i in range(1,9)]
          assert levels['follower_source']['name']=='Foll Map'
          assert levels['follower_root']['name']=='Foll Root'
          assert 'follower_mod' not in levels
          assert levels['follower_source']['knobs']==[
              'content_map','travel_map','split_map','retrigger_held',
              'chromatic_map','motion_control_33'
          ]
          assert all(any(item.get('level')==name for item in levels['root']['params']) for name in ('motifs','motif_global'))
          assert all(name not in levels for name in ('mixed_cadences_1','mixed_cadences_2','pitch_cadences'))
          assert levels['next_harm']['name']=='Next Harm'
          assert levels['next_harm']['knobs']==[
              'next_lookahead','next_anti_buffer_ms','boundary_buffer_ms','next_model',
              'next_shift','next_loop_length','next_position','next_harmony'
          ]
          assert next(p for p in levels['next_harm']['params'] if p.get('key')=='boundary_buffer_ms')==buffer
          assert levels['global_transpose']['name']=='Key & Scale'
          assert levels['global_transpose']['knobs']==[
              'master_transpose','transpose','accidentals','key_center_scale','conductor_key_travel','parallel_scale','key_center','sounding_key'
          ]
          assert any(item.get('level')=='global_transpose' for item in levels['root']['params'])
          source=Path('modules/harmonybus/dsp/harmonybus.c').read_text()
          assert 'static void hb_render_conductor_event' in source
          assert 'rendered_note=is_on?hb_key_conductor_pitch(instance,note+g_bus.global_transpose)' in source
          assert 'render_pitch=local_pitch' in source
          # Final-stage follower transpose is verified by follower_reference_test.
          assert 'if(!strcmp(key,"pretranspose_root"))' in source
          assert 'if(!strcmp(key,"final_root"))' in source
          assert 'if(!strcmp(key,"final_harmony"))' in source
          assert 'hb_render_conductor_event(instance,note,length>=3?input[2]:0,is_on,is_off,input_channel);' in source
          assert 'static void hb_prepare_role_change_flush' in source
          assert 'hb_prepare_role_change_flush(instance);' in source
          assert 'static int hb_emit_role_change_flush' in source
          assert 'role_flush_emitted=hb_emit_role_change_flush' in source
          # Shared harmony/prediction semantics remain global.
          assert 'static double hb_chord_grid_beats(void)' in source
          assert 'static double hb_anticipation_beats(void)' in source
          assert 'hb_global_root_policy()' in source
          assert 'hb_global_explicit_root()' in source
          assert 'static void hb_next_update_playhead(int frames,int sample_rate)' in source
          assert 'static int hb_next_model_accepts_observed' in source
          # Follower voice behavior is now instance-local.
          assert 'int content_map=instance->content_map;' in source
          assert 'int travel=instance->travel_map;' in source
          assert 'int selected=hb_shared_follower_scale();' in source
          assert 'instance->follower_split_map);' in source
          assert 'hb_quant_grid_beats_for(instance)' in source
          assert 'int setting=hb_effective_follower_buffer_for(instance);' in source
          assert 'double capture=hb_follower_capture_beats_for(instance);' in source
          assert 'instance->approach_control=hb_approach_toggle' in source
          assert '"hb16,%d,%d,%d,%d,%d,%d,%d,%d,%d,%d,%d,%d,%d,%d,%d,%d,%d,%d,%d,%d,%d,%d,%d,%d,%d"' in source
          for obsolete in (
              'hb_global_content_map()', 'hb_global_travel_map()', 'hb_global_scale()',
              'hb_set_global_content_map(', 'hb_set_global_travel_map(', 'hb_set_global_scale('
          ):
              assert obsolete not in source, obsolete
          assert '#include "../../../src/follower_timing.h"' in source
          assert '#include "../../../src/closest_split.h"' in source
          assert 'learned_boundary=hb_next_effective_boundary' in source
          assert 'Compare against the UNSHIFTED learned schedule' in source
          closest=source[source.index('static int hb_map_follower_note_classified'):source.index('static int hb_map_follower_note_now')]
          assert 'hb_cached_closest_assignment(' in closest
          queue=source[source.index('static int hb_queue_follower_event'):source.index('static int hb_source_interval_to_default_degree')]
          assert 'hb_follower_capture_target(' in queue
          assert 'hb_next_effective_boundary' in queue
          PY

      - name: Install build tools
        if: steps.plan.outputs.mode == 'full'
        run: sudo apt-get update && sudo apt-get install -y clang lld file fonts-dejavu-core

      - name: Run comprehensive native suites in parallel
        if: steps.plan.outputs.mode == 'full'
        run: python3 scripts/run_native_suites.py

      - name: Preserve native suite logs
        if: always() && steps.plan.outputs.mode == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: native-suite-logs
          path: /tmp/hb-native-logs
          retention-days: 7

      - name: Build guide from canonical Markdown and SVG
        if: steps.plan.outputs.mode == 'full'
        run: |
          python3 -m pip install -r scripts/docs-requirements.txt
          python3 scripts/build_timing_guide.py

      - name: Build ARM64 HarmonyBus
        if: steps.plan.outputs.mode == 'full'
        run: bash scripts/build_harmonybus_move.sh

      - name: Verify complete module loading and preset restoration
        if: steps.plan.outputs.mode == 'full'
        run: |
          clang -std=c11 -D_POSIX_C_SOURCE=200809L -O2 -fPIC -shared \
            -include sys/mman.h -include unistd.h -Wl,-z,defs \
            modules/harmonybus/dsp/harmonybus.c src/harmony_core.c \
            -lm -o /tmp/harmonybus-native.so
          clang -std=c11 -O2 tests/module_load_test.c -ldl -o /tmp/harmonybus-load-test
          /tmp/harmonybus-load-test /tmp/harmonybus-native.so
          readelf --dyn-syms --wide build/move/harmonybus-dsp.so | \
            awk '$7 == "UND" && $8 ~ /^hb_/ { print; bad=1 } END { exit bad }'

      - name: Verify HarmonyBus package
        if: steps.plan.outputs.mode == 'full'
        run: |
          gzip -t "$HB"
          rm -rf /tmp/hb-verify && mkdir -p /tmp/hb-verify
          tar -xzf "$HB" -C /tmp/hb-verify
          test -f /tmp/hb-verify/harmonybus/module.json
          test -f /tmp/hb-verify/harmonybus/dsp.so
          test -f /tmp/hb-verify/harmonybus/canvas.js
          node --check /tmp/hb-verify/harmonybus/canvas.js
          python3 - <<'PY'
          import json, os
          module=json.load(open('/tmp/hb-verify/harmonybus/module.json'))
          assert module['version']==os.environ['VERSION']
          panel=module['capabilities']['ui_hierarchy']['levels']['follower_source']
          assert panel['knobs'][1]=='travel_map'
          next_panel=module['capabilities']['ui_hierarchy']['levels']['next_harm']
          assert next_panel['knobs'][0]=='next_lookahead'
          assert next_panel['knobs'][1:3]==['next_anti_buffer_ms','boundary_buffer_ms']
          assert 'next_reset' not in next_panel['knobs']
          global_panel=module['capabilities']['ui_hierarchy']['levels']['global_transpose']
          assert global_panel['knobs'][0]=='master_transpose'
          assert global_panel['knobs'][1]=='transpose'
          assert global_panel['knobs'][3]=='key_center_scale'
          assert 'touch_hold_ms' in module['capabilities']['ui_hierarchy']['levels']['motion_conditions']['knobs']
          PY

      - name: Seal comprehensive release artifact
        if: steps.plan.outputs.mode == 'full'
        run: python3 scripts/ci_release.py seal hb

      - name: Preserve tested device package
        if: steps.plan.outputs.mode == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: comprehensive-release
          path: ci-release/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish release
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$HB" dist/HarmonyBus-Timing-Guide.pdf --clobber
          else
            gh release create "$TAG" "$HB" dist/HarmonyBus-Timing-Guide.pdf --target "$GITHUB_SHA" --title "Harmony Bus ${TAG}" --notes "HarmonyBus 0.2.270 fixes shared Render To Channel note ownership: releasing a recorded auto-chord on one track no longer cuts off overlapping notes held by another track on the same MIDI destination. Fresh attacks remain audible and the final owner releases the pitch. Auto Chord and Arp/Strum remain per track; clips still store input notes and settings, not expanded chord notes. Covers both release orders, single-note/chord layering, separate channels, role changes, rerouting and removal. Also avoids rescanning empty release queues on each audio tick, reusing the existing cursor. Keep Movy hbclean.189 and the current Schwung host." || { gh release view "$TAG" >/dev/null && gh release upload "$TAG" "$HB" dist/HarmonyBus-Timing-Guide.pdf --clobber; }
          fi
          # A failed gh create can leave a draft with uploaded assets. A retry
          # must publish it before exposing its URL to module installers.
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true ]; then
            gh release edit "$TAG" --draft=false --target "$GITHUB_SHA" --notes "HarmonyBus 0.2.270 fixes shared Render To Channel note ownership: releasing a recorded auto-chord on one track no longer cuts off overlapping notes held by another track on the same MIDI destination. Fresh attacks remain audible and the final owner releases the pitch. Auto Chord and Arp/Strum remain per track; clips still store input notes and settings, not expanded chord notes. Covers both release orders, single-note/chord layering, separate channels, role changes, rerouting and removal. Also avoids rescanning empty release queues on each audio tick, reusing the existing cursor. Keep Movy hbclean.189 and the current Schwung host." || test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = false
          fi
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = false

      - name: Update Module Store metadata
        if: steps.plan.outputs.publish == 'true'
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          version = os.environ["VERSION"]
          Path("release.json").write_text(json.dumps({"version": version, "download_url": f"https://github.com/douglasmason/harmonybus/releases/download/v{version}/harmonybus-v{version}-module.tar.gz"}, indent=2) + "\n")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release.json
          if ! git diff --cached --quiet; then
            git commit -m "Update release.json for v${VERSION}"
            git push origin main
          fi
