name: Build and publish HarmonyBus

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply one-time follower modifier migration
        run: |
          if test -f scripts/add_follower_modifier_panel.py; then
            python3 scripts/add_follower_modifier_panel.py
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add modules/harmonybus/module.json modules/harmonybus/dsp/harmonybus.c
            if ! git diff --cached --quiet; then
              git commit -m 'Add follower modifier performance panel'
              git push origin main
            fi
          fi

      - name: Resolve version
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("modules/harmonybus/module.json"))["version"])')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "HB=dist/harmonybus-v${VERSION}-module.tar.gz" >> "$GITHUB_ENV"

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y clang lld file

      - name: Run native core tests
        run: |
          clang -std=c11 -O2 tests/harmony_core_test.c src/harmony_core.c -o /tmp/harmony_core_test
          /tmp/harmony_core_test

      - name: Build ARM64 HarmonyBus
        run: |
          bash scripts/build_harmonybus_move.sh

      - name: Verify HarmonyBus package
        run: |
          gzip -t "$HB"
          rm -rf /tmp/hb-verify
          mkdir -p /tmp/hb-verify
          tar -xzf "$HB" -C /tmp/hb-verify
          test -f /tmp/hb-verify/harmonybus/module.json
          test -f /tmp/hb-verify/harmonybus/dsp.so
          python3 -c 'import json, os; assert json.load(open("/tmp/hb-verify/harmonybus/module.json"))["version"] == os.environ["VERSION"]'

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$HB" --clobber
          else
            gh release create "$TAG" "$HB" \
              --title "Harmony Bus ${TAG}" \
              --notes "HarmonyBus MIDI FX for Ableton Move."
          fi
