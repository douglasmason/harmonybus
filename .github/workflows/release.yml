name: Build and publish HarmonyBus

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply current HarmonyBus normalization
        run: |
          python3 scripts/cleanup_foll_mod_v0276.py
          python3 scripts/foll_mod_buttons_v0277.py
          python3 scripts/ui_test_as_page_v0278.py
          python3 scripts/fix_scale_controls_v0279.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/harmonybus/module.json modules/harmonybus/dsp/harmonybus.c modules/harmonybus/canvas.js
          if ! git diff --cached --quiet; then
            git commit -m 'Normalize HarmonyBus v0.2.79 source'
            git push origin main
          fi

      - name: Resolve and validate version/UI
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("modules/harmonybus/module.json"))["version"])')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "HB=dist/harmonybus-v${VERSION}-module.tar.gz" >> "$GITHUB_ENV"
          grep -q "#define HB_VERSION \"${VERSION}\"" modules/harmonybus/dsp/harmonybus.c
          node --check modules/harmonybus/canvas.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          module=json.load(open('modules/harmonybus/module.json'))
          assert module['version']=='0.2.79'
          levels=module['capabilities']['ui_hierarchy']['levels']
          assert levels['follower_source']['name']=='Foll Map'
          assert levels['follower_root']['name']=='Foll Root'
          assert levels['follower_mod']['name']=='Foll Mod'
          assert levels['follower_this']['name']=='Foll Trk'
          assert levels['follower_all']['name']=='Foll All'
          panel=levels['follower_mod']
          assert panel['knobs']==[
              'approach','foll_mod_blank2','mod_scale_above','mod_chrom_below',
              'foll_mod_blank5','approach_reset','approach_scale_next','approach_chrom_next'
          ]
          params={p.get('key'):p for p in module['capabilities']['chain_params']}
          assert 'follower_mod_canvas' not in params
          for key, options in {
              'approach_reset':['-','Reset'],
              'approach_scale_next':['-','Scale +'],
              'approach_chrom_next':['-','Chrom -'],
          }.items():
              assert params[key]['type']=='enum'
              assert params[key]['options']==options
              assert params[key]['access']=='write'
          ui=levels['ui_test']
          assert ui['knobs']==['content_map','travel_map','split_map']
          test=params['ui_test_canvas']
          assert test['type']=='canvas'
          assert test['canvas_script']=='canvas.js'
          assert test['canvas_overlay']=='ui_test'
          assert test['as_page'] is True
          canvas=Path('modules/harmonybus/canvas.js').read_text()
          assert 'ui_test:' in canvas
          source=Path('modules/harmonybus/dsp/harmonybus.c').read_text()
          assert 'instance->approach_pad_armed=2;g_bus.approach_mode=0' in source
          assert 'instance->approach_pad_armed=0;g_bus.approach_mode=0' in source
          assert 'g_bus.approach_control=2;instance->approach_pad_armed=1' in source
          blank='if(!strcmp(key,"foll_mod_blank3")||!strcmp(key,"foll_mod_blank4")||!strcmp(key,"foll_mod_blank5"))return snprintf(buffer,(size_t)length,"");'
          assert source.count(blank)==1
          PY

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y clang lld file

      - name: Run native core tests
        run: |
          clang -std=c11 -O2 tests/harmony_core_test.c src/harmony_core.c -o /tmp/harmony_core_test
          /tmp/harmony_core_test

      - name: Build ARM64 HarmonyBus
        run: bash scripts/build_harmonybus_move.sh

      - name: Verify HarmonyBus package
        run: |
          gzip -t "$HB"
          rm -rf /tmp/hb-verify && mkdir -p /tmp/hb-verify
          tar -xzf "$HB" -C /tmp/hb-verify
          test -f /tmp/hb-verify/harmonybus/module.json
          test -f /tmp/hb-verify/harmonybus/dsp.so
          test -f /tmp/hb-verify/harmonybus/canvas.js
          node --check /tmp/hb-verify/harmonybus/canvas.js
          python3 - <<'PY'
          import json, os
          module=json.load(open('/tmp/hb-verify/harmonybus/module.json'))
          assert module['version']==os.environ['VERSION']
          params={p.get('key'):p for p in module['capabilities']['chain_params']}
          for key in ('approach_reset','approach_scale_next','approach_chrom_next'):
              assert params[key].get('access')=='write'
          assert params['ui_test_canvas'].get('as_page') is True
          PY

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$HB" --clobber
          else
            gh release create "$TAG" "$HB" --title "Harmony Bus ${TAG}" --notes "HarmonyBus MIDI FX for Ableton Move."
          fi

      - name: Update Module Store metadata
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          version = os.environ["VERSION"]
          Path("release.json").write_text(json.dumps({"version": version, "download_url": f"https://github.com/douglasmason/harmonybus/releases/download/v{version}/harmonybus-v{version}-module.tar.gz"}, indent=2) + "\n")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release.json
          if ! git diff --cached --quiet; then
            git commit -m "Update release.json for v${VERSION}"
            git push origin main
          fi
