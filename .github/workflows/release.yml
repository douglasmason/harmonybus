name: Build and publish HarmonyBus

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply one-time HB262 migration
        run: |
          if grep -q '#define HB_VERSION "0.2.61"' modules/harmonybus/dsp/harmonybus.c; then
            python3 scripts/patch_hb262.py
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add modules/harmonybus/dsp/harmonybus.c modules/harmonybus/module.json scripts/build_harmonybus_move.sh release.json .github/workflows/release.yml
            git commit -m 'Fix Relative mapping and add Closest Split controls for v0.2.62'
            git push origin main
          fi

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y clang lld file

      - name: Run native core tests
        run: |
          clang -std=c11 -O2 tests/harmony_core_test.c src/harmony_core.c -o /tmp/harmony_core_test
          /tmp/harmony_core_test

      - name: Build ARM64 HarmonyBus
        run: |
          bash scripts/build_harmonybus_move.sh

      - name: Verify HarmonyBus package
        run: |
          HB=dist/harmonybus-v0.2.61-module.tar.gz
          gzip -t "$HB"
          rm -rf /tmp/hb-verify
          mkdir -p /tmp/hb-verify
          tar -xzf "$HB" -C /tmp/hb-verify
          test -f /tmp/hb-verify/harmonybus/module.json
          test -f /tmp/hb-verify/harmonybus/dsp.so
          python3 -c 'import json; assert json.load(open("/tmp/hb-verify/harmonybus/module.json"))["version"] == "0.2.61"'

      - name: Publish v0.2.61 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.61 >/dev/null 2>&1; then
            gh release upload v0.2.61 dist/harmonybus-v0.2.61-module.tar.gz --clobber
          else
            gh release create v0.2.61 dist/harmonybus-v0.2.61-module.tar.gz \
              --title "Harmony Bus v0.2.61" \
              --notes "HarmonyBus MIDI FX for Ableton Move."
          fi
