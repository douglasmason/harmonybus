name: Arp phase regression
on:
  push:
    branches: [arp-phase]
  pull_request:
    paths:
      - 'src/chord_player.h'
      - 'modules/harmonybus/**'
      - 'tests/chord_player_test.c'
      - '.github/workflows/arp-phase.yml'
permissions:
  contents: read
jobs:
  phase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Chord player API and timing regressions
        run: |
          clang -std=c11 -D_POSIX_C_SOURCE=200809L -O1 -g -fsanitize=undefined -fno-sanitize-recover=all tests/chord_player_test.c src/harmony_core.c -lm -o /tmp/chord_phase_test
          /tmp/chord_phase_test
      - name: Build Move modules
        run: bash scripts/build_harmonybus_move.sh
